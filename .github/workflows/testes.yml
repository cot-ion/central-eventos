name: Testes da automação

on:
  push:
    paths: ["automacao/**", ".github/workflows/testes.yml"]
  pull_request:
    paths: ["automacao/**", ".github/workflows/testes.yml"]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r automacao/requirements.txt
      - run: python -m unittest discover -s testes -v
        working-directory: automacao
