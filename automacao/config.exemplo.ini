; Configuração da sincronização. Copie para config.ini (que NÃO vai para o GitHub)
; e ajuste. Linhas começando com ";" são comentários.

[pastas]
; Pasta do SharePoint sincronizada pelo OneDrive, com os .pptx dos modelos.
; Clique com o botão direito na pasta no Explorer > "Copiar como caminho".
; Subpastas também são lidas. %USERPROFILE% é aceito.
pptx = %USERPROFILE%\NOME DA EMPRESA\Equipe COT - Documentos\Central de Eventos

[git]
branch = main
remoto = origin
; Nome/e-mail que aparecem nos commits automáticos (não precisa ser real).
autor_nome = Robô Central de Eventos
autor_email = central-eventos@users.noreply.github.com

[seguranca]
; Arquivos alterados há menos que isto (segundos) esperam a próxima rodada,
; para não ler um .pptx que o OneDrive ainda está baixando.
estabilidade_segundos = 120
; Não publica se o número de eventos cair mais que este percentual de uma vez
; (proteção contra pasta vazia / OneDrive desconectado). Rode com --forcar se
; a remoção for intencional.
queda_maxima_pct = 50

[conteudo]
; "sim": mantém no site os modelos importados manualmente do PDF original.
; Mude para "nao" quando os .pptx da pasta já cobrirem todos os modelos.
manter_eventos_manuais = sim
